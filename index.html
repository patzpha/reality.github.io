<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>MetaVision Simples</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body {
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #000;
  font-family: sans-serif;
}
canvas {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  z-index: 1;
}
video {
  position: absolute;
  top: -9999px;
  left: -9999px;
  opacity: 0;
}
#menu {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: #121212;
  z-index: 100;
  padding: 30px 20px;
  overflow-y: auto;
}
#menu.escondido { display: none; }
h1 { color: #fff; margin-bottom: 20px; text-align: center; }
p { color: #aaa; margin-bottom: 30px; text-align: center; }
button {
  display: block;
  width: 100%;
  padding: 15px;
  font-size: 18px;
  border: none;
  border-radius: 10px;
  margin-bottom: 15px;
  cursor: pointer;
}
#entrar {
  background: #8b7cf6;
  color: #fff;
  font-weight: bold;
}
#config {
  background: #333;
  color: #fff;
}
#status {
  color: #88ff88;
  font-size: 14px;
  margin-top: 15px;
  text-align: center;
}
</style>
</head>
<body>

<video id="video" playsinline muted></video>
<canvas id="tela"></canvas>

<div id="menu">
  <h1>🔮 MetaVision</h1>
  <p>Toque em "Entrar" e permita a câmera quando solicitado.</p>
  <button id="entrar">Entrar</button>
  <p id="status"></p>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.152.2/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1675469240/hands.js"></script>
<script>
// ELEMENTOS
const tela = document.getElementById('tela');
const video = document.getElementById('video');
const menu = document.getElementById('menu');
const status = document.getElementById('status');
const ctx = tela.getContext('2d');

// CÂMERA SIMPLES
let cameraLigada = false;
async function ligarCamera() {
  status.textContent = "Solicitando câmera...";
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ 
      video: { facingMode: 'environment', width: 1280, height: 720 },
      audio: false
    });
    video.srcObject = stream;
    await video.play();
    cameraLigada = true;
    status.textContent = "✅ Câmera ativa!";
    menu.classList.add('escondido');
    iniciar();
  } catch (erro) {
    status.textContent = "❌ Erro: " + erro.message;
    console.error(erro);
  }
}

// AJUSTAR TELA
function ajustarTela() {
  tela.width = window.innerWidth;
  tela.height = window.innerHeight;
}
window.addEventListener('resize', ajustarTela);
ajustarTela();

// VARIÁVEIS
let maos = null;
let temMao = false;
let pontosMao = [];

// INICIAR MEDIAPIPE
async function iniciarMao() {
  if (typeof Hands === 'undefined') {
    status.textContent += "\n⚠️ Biblioteca da mão não carregou";
    return;
  }
  maos = new Hands({locateFile: (file) => {
    return 'https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1675469240/' + file;
  }});
  maos.setOptions({
    maxNumHands: 1,
    modelComplexity: 0,
    minDetectionConfidence: 0.5
  });
  maos.onResults((resultado) => {
    if (resultado.multiHandLandmarks && resultado.multiHandLandmarks.length > 0) {
      temMao = true;
      pontosMao = resultado.multiHandLandmarks[0];
    } else {
      temMao = false;
    }
  });
  status.textContent += "\n✅ Rastreamento de mão pronto!";
}

// LOOP PRINCIPAL
async function loop() {
  requestAnimationFrame(loop);
  
  // Desenhar câmera
  if (cameraLigada && video.readyState >= 2) {
    ctx.drawImage(video, 0, 0, tela.width, tela.height);
    
    // Enviar imagem para detecção de mão
    if (maos) {
      try {
        await maos.send({image: video});
      } catch(e) {}
    }
    
    // Desenhar mão simples
    if (temMao && pontosMao.length > 0) {
      const escalaX = tela.width;
      const escalaY = tela.height;
      
      // Desenhar pontos suaves
      for (let i = 0; i < pontosMao.length; i++) {
        const x = pontosMao[i].x * escalaX;
        const y = pontosMao[i].y * escalaY;
        
        // Junta principal (pulso) maior e diferente
        if (i === 0) {
          ctx.beginPath();
          ctx.arc(x, y, 12, 0, Math.PI * 2);
          ctx.fillStyle = 'rgba(100, 180, 255, 0.8)';
          ctx.fill();
          ctx.strokeStyle = '#fff';
          ctx.lineWidth = 2;
          ctx.stroke();
        } else {
          // Outras juntas
          ctx.beginPath();
          ctx.arc(x, y, 5, 0, Math.PI * 2);
          ctx.fillStyle = 'rgba(200, 230, 255, 0.6)';
          ctx.fill();
        }
      }
      
      // Desenhar linhas SUAVES entre os dedos
      ctx.strokeStyle = 'rgba(200, 230, 255, 0.4)';
      ctx.lineWidth = 3;
      ctx.lineCap = 'round';
      
      const ligacoes = [
        [0, 1], [1, 2], [2, 3], [3, 4],
        [0, 5], [5, 6], [6, 7], [7, 8],
        [5, 9], [9, 10], [10, 11], [11, 12],
        [9, 13], [13, 14], [14, 15], [15, 16],
        [13, 17], [17, 18], [18, 19], [19, 20],
        [0, 17]
      ];
      
      ligacoes.forEach(([a, b]) => {
        ctx.beginPath();
        ctx.moveTo(pontosMao[a].x * escalaX, pontosMao[a].y * escalaY);
        ctx.lineTo(pontosMao[b].x * escalaX, pontosMao[b].y * escalaY);
        ctx.stroke();
      });
    }
  }
}

// INICIAR TUDO
function iniciar() {
  iniciarMao();
  loop();
}

// BOTÕES
document.getElementById('entrar').addEventListener('click', ligarCamera);

</script>
</body>
</html>
